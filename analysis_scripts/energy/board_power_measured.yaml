#
# MEASURED board power (W), the "measured" source for estimate_energy.py
# (--power-source measured). The datasheet ranges in board_power.yaml stay as
# the comparison. Fill it with record_power_measurement.py from
# ina228_reader.py summary lines; don't edit samples by hand.
#
# "listen" states are P_listen (microphone capturing, CPU idle); the
# idle_mic_off states are kept for comparison and are not used by the
# selection.
#
# Each state holds a list of windows (repeats). With samples present, the
# estimator uses [min - resolution, max + resolution] of the window means as
# that value's range; states without samples fall back to board_power.yaml
# (reported per board/state in the output).
#
# Firmware for every state: prepare_power_firmware.py (SC_5 1s model,
# CREST_POWER_STATE). P_sleep is not measured yet (no sleep firmware), so it
# always comes from board_power.yaml.

schema_version: 1
instrument:
  meter: "INA228 (VBUS only) read by Raspberry Pi 4 over I2C"
  breakouts: "Adafruit 5978 USB-C plug breakout + laptop-side breakout, USB-C to micro-USB adapters"
  shunt_ohms: 0.015
  adc_range: "+-40.96 mV"

boards:
  rp2040:
    # Which NINA state the deployment uses (sets P_active/P_listen); the other
    # pair is kept for comparison.
    nina_for_selection: reset
    states:
      inference_nina_free: []
      listen_nina_free: []
      inference_nina_reset: []
      listen_nina_reset: []
      # Mic off, CPU idle: for the microphone's own cost (listen minus this).
      idle_mic_off_nina_free: []
      idle_mic_off_nina_reset: []
  esp32s3:
    states:
      inference: []
      listen: []
      idle_mic_off: []
  rpi4:
    # Optional: the Pi can also be measured through the same INA228 (VBUS on
    # its USB-C input) while it reads the INA228 itself.
    states:
      idle: []
      active_1t: []
      active_4t: []
