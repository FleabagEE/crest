#
# Measured log-mel preprocessing times per (board, threads), for the
# streaming and naive designs in estimate_energy.py.
#
#   frame_s:   one frame = the work for one hop (hop_s of audio)
#   window_s:  a whole window computed in batch, keyed by window length (s)
#
# Streaming design: frames are computed as audio arrives; response latency =
# frame_s + inference; listening power rises by duty * (P_active - P_listen),
# with duty = frame_s / hop_s.
# Naive design: the whole window is computed after it ends; t = window_s[L] +
# inference.

hop_s: 0.010

boards:
  rp2040:
    threads_1:
      frame_s: 0.004626
      window_s:
        1: 0.460508
        2: 0.930424
      source: >-
        Nano RP2040 Connect, sketches/logmel_golden, integer q31 front end
        (crest_logmel.h, bit-exact with the host build), PCM in RAM, 125 MHz,
        2026-10-28: frame median over 98 frames; window medians of 5 runs
        (98 / 198 frames + int8 quantization).
  rpi4:
    # Training repo's numpy log_mel on the Pi via
    # analysis_scripts/rpi4_latency_bench/run_pi_logmel_timing.py, with BLAS
    # threads matching the inference thread count.
    # Measured 2026-10-28 (results/pi_logmel_timing_20261028_151632.json):
    # performance governor, 1.8 GHz, throttled 0x0, <= 47.2 C; Pi numpy 2.2.4,
    # output within 9.5e-7 of the host (numpy 1.26.4). frame = log_mel on 400
    # samples (median of 500, dominated by Python/numpy call overhead);
    # windows = medians of 50.
    threads_1:
      frame_s: 0.0003112
      window_s:
        1: 0.0055482
        2: 0.0118071
      source: training repo log_mel (numpy), 1 BLAS thread
    threads_4:
      frame_s: 0.0003115
      window_s:
        1: 0.0055205
        2: 0.0115322
      source: training repo log_mel (numpy), 4 BLAS threads
